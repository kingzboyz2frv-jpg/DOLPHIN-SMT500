name: Build Dolphin SMT500 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "cmake;3.25.0" "ndk;30.0.15729638"

      - name: Build debug APK
        working-directory: Source/Android
        run: sh gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-SMT500-debug
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
